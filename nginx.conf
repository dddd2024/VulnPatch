# =============================================================================
# VulnPatch Nginx 反向代理配置
# =============================================================================
# 用于生产环境部署，提供以下功能：
#   - 反向代理到 VulnPatch 后端服务
#   - 静态资源缓存
#   - 请求体大小限制（支持大文件扫描上传）
#   - WebSocket 支持（用于 SSE 扫描流）
#   - 安全头设置
#
# 使用方式：
#   1. 取消 docker-compose.yml 中 nginx 服务的注释
#   2. 将此文件挂载到 nginx 容器的 /etc/nginx/conf.d/default.conf
# =============================================================================

upstream vulnpatch_backend {
    # VulnPatch 后端服务地址（Docker Compose 内部 DNS）
    server backend:8000;

    # 保持长连接，减少 TCP 握手开销
    keepalive 32;
}

server {
    # 监听 80 端口（生产环境建议配置 HTTPS 443）
    listen 80;
    server_name localhost;

    # 请求体大小限制：扫描可能上传较大的代码文件
    client_max_body_size 100M;

    # ---------------------------------------------------------------------------
    # 安全响应头
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------------
    # 代理配置
    # ---------------------------------------------------------------------------
    location / {
        proxy_pass http://vulnpatch_backend;
        proxy_http_version 1.1;

        # 传递客户端真实信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE 支持（扫描流式输出需要）
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        # 超时设置（扫描可能耗时较长）
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ---------------------------------------------------------------------------
    # 静态资源缓存（前端 assets）
    # ---------------------------------------------------------------------------
    location /assets/ {
        proxy_pass http://vulnpatch_backend;
        proxy_http_version 1.1;

        # 静态资源长期缓存（Vite 构建的文件名含 hash）
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # 健康检查端点（不记录日志）
    # ---------------------------------------------------------------------------
    location /health {
        proxy_pass http://vulnpatch_backend;
        proxy_http_version 1.1;
        access_log off;
    }
}
