version: "3.9"

# ============================================
# VulnScan Production Deployment
# ============================================
# This compose file is for production use.
# It uses pre-built images and enforces strict resource limits.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - Images must be built and pushed to a registry
#   - SSL certificates must be placed in ./ssl/
#   - .env file must contain all secrets
# ============================================

services:
  # ========================
  # Frontend (Nginx)
  # ========================
  frontend:
    image: ${REGISTRY:-registry.example.com}/vulnscan-frontend:${IMAGE_TAG:-latest}
    container_name: vulnscan-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    networks:
      - vulnscan-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service_name,environment"
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

  # ========================
  # Backend (FastAPI)
  # ========================
  backend:
    image: ${REGISTRY:-registry.example.com}/vulnscan-backend:${IMAGE_TAG:-latest}
    container_name: vulnscan-backend
    restart: always
    expose:
      - "8000"
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://vulnscan:${DB_PASSWORD}@db:5432/vulnscan
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # Neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      # Sandbox Service
      - SANDBOX_API_URL=http://sandbox:8001
      - SANDBOX_API_KEY=${SANDBOX_API_KEY}
      # LLM Platforms (9 platforms)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-01}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - MOONSHOT_API_